name: Deploy to Railway

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          railway up \
            --service api \
            --environment ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} \
            --detach
        continue-on-error: true

      - name: Deploy Web to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          railway up \
            --service web \
            --environment ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} \
            --detach
        continue-on-error: true

      - name: Wait for deployment
        run: sleep 30

      - name: Health check API
        run: |
          API_URL=${{ secrets.RAILWAY_API_URL }}
          echo "Checking API health at: $API_URL/health"
          for i in {1..10}; do
            if curl -f "$API_URL/health" > /dev/null 2>&1; then
              echo "✓ API is healthy"
              exit 0
            fi
            echo "Attempt $i/10: Waiting for API to be ready..."
            sleep 10
          done
          echo "✗ API health check failed"
          exit 1
        continue-on-error: true

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Verify API connectivity
        run: |
          API_URL=${{ secrets.RAILWAY_API_URL }}
          echo "Testing API endpoints..."

          # Health check
          curl -f "$API_URL/health" || exit 1

          # Test database connection
          curl -f "$API_URL/health/db" 2>/dev/null || echo "Database health check endpoint not found (ok)"

          echo "✓ API deployment verified"

      - name: Verify Web connectivity
        run: |
          WEB_URL=${{ secrets.RAILWAY_WEB_URL }}
          echo "Testing Web endpoints..."

          # Homepage
          curl -f -L "$WEB_URL" > /dev/null || exit 1

          # Login page
          curl -f "$WEB_URL/login" > /dev/null || exit 1

          echo "✓ Web deployment verified"
